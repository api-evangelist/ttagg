name: TTAGG
description: TTAGG was a social media analytics startup founded in October 2011 in
  Fayetteville, Arkansas, and backed by 500 Global. It rebranded as DataRank in 2013,
  providing brand managers with tools to monitor and rank conversations about their
  brands and competitors across social media, blogs, forums, and e-commerce sites.
  DataRank was acquired by Simply Measured in 2015, which was in turn acquired by
  Sprout Social in 2017. The company no longer operates independently and publishes
  no public API; datarank.com redirects to sproutsocial.com and ttagg.com is parked.
